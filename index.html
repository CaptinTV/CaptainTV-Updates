<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Captain TV</title>
  <style>
    :root { --bg:#0f0f12; --card:#1a1a20; --text:#f2f2f5; --muted:#9a9aa6; --accent:#e24b4a; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .card {
      width: 100%; max-width: 420px; background: var(--card); border-radius: 24px;
      padding: 32px 24px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.25);
    }
    h1 { margin: 0 0 4px; font-size: 28px; }
    .version { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
    .notes { text-align: right; white-space: pre-line; color: var(--muted); font-size: 14px; line-height: 1.8; margin-bottom: 24px; }
    .btn {
      display: inline-block; width: 100%; padding: 14px; border-radius: 14px; border: 0;
      background: var(--accent); color: #fff; font-size: 16px; font-weight: 700; text-decoration: none;
    }
    .hint { margin-top: 16px; font-size: 12px; color: var(--muted); line-height: 1.7; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Captain TV</h1>
    <div class="version" id="version">جارٍ التحميل...</div>
    <div class="notes" id="notes"></div>
    <a class="btn" id="download" href="#" style="display:none">تحميل التطبيق</a>
    <p class="hint">بعد التحميل افتح الملف واسمح بالتثبيت من هذا المصدر.</p>
  </main>
  <script>
    fetch('version.json?t=' + Date.now())
      .then(r => r.json())
      .then(v => {
        document.getElementById('version').textContent = 'الإصدار ' + v.versionName + (v.sizeMb ? ' • ' + v.sizeMb + ' MB' : '');
        document.getElementById('notes').textContent = v.notes || '';
        var a = document.getElementById('download');
        a.href = v.apkUrl;
        a.style.display = 'inline-block';
      })
      .catch(() => { document.getElementById('version').textContent = 'تعذّر تحميل معلومات الإصدار'; });
  </script>
</body>
</html>
